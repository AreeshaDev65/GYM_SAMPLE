document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    55%  { transform:rotateX(10deg); opacity:1; }\n    78%  { transform:rotateX(-4deg); }\n    100% { transform:rotateX(0deg); opacity:1; }\n  }\n  @keyframes riseIn {\n    from { opacity:0; transform:translateY(10px); }\n    to   { opacity:1; transform:translateY(0); }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    * { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#141419;color:#ECE9E1;font-family:Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden\">\n\n  <header style=\"position:sticky;top:0;z-index:40;background:rgba(20,20,25,.88);backdrop-filter:blur(12px);border-bottom:1px solid #26262E\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:baseline;gap:10px;cursor:pointer\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase\">Baseline<\u002Fspan>\n        <span style=\"width:7px;height:7px;background:#F5D400;display:block;transform:translateY(-3px)\"><\u002Fspan>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <nav style=\"display:flex;align-items:center;gap:34px\">\n          <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ n.go }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:8px 0;border-bottom:1px solid transparent;color:{{ n.fg }};border-bottom-color:{{ n.line }}\" style-hover=\"color:#ECE9E1\">{{ n.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ goSchedule }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:#F5D400;color:#141419;padding:12px 20px;font-weight:600;cursor:pointer\" style-hover=\"background:#ECE9E1\">Book<\u002Fbutton>\n        <\u002Fnav>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"display:flex;flex-direction:column;gap:5px;padding:12px;cursor:pointer;border:1px solid #33333D\">\n          <span style=\"width:20px;height:1.5px;background:#ECE9E1;display:block\"><\u002Fspan>\n          <span style=\"width:20px;height:1.5px;background:#ECE9E1;display:block\"><\u002Fspan>\n          <span style=\"width:13px;height:1.5px;background:#F5D400;display:block\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav style=\"border-top:1px solid #26262E;padding:12px 24px 22px;display:flex;flex-direction:column;gap:2px;animation:riseIn .25s ease\">\n        <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ n.go }}\" style=\"text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.06em;padding:14px 0;min-height:48px;cursor:pointer;border-bottom:1px solid #22222A;color:{{ n.fg }}\">{{ n.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <!-- ══════════════ HOME ══════════════ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,9vw,128px) 24px clamp(40px,6vw,72px)\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:clamp(28px,5vw,48px)\">\n        <span style=\"width:36px;height:1px;background:#F5D400;display:block\"><\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8A8A96\">General fitness · Est. 2019 · Members only<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(52px,11.5vw,158px);line-height:.88;letter-spacing:-.015em;text-wrap:balance\">Train by the<br>numbers <span style=\"color:#F5D400\">you set.<\u002Fspan><\u002Fh1>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px;margin-top:clamp(32px,5vw,56px);align-items:end\">\n        <p style=\"margin:0;max-width:44ch;color:#A2A2AE;font-size:17px;line-height:1.65\">No hype, no guesswork. Every class at Baseline is measured — load, output, capacity, recovery — so the only thing you compete with is your last session.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <button sc-camel-on-click=\"{{ goSchedule }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:#F5D400;color:#141419;white-space:nowrap;padding:18px 30px;font-weight:600;cursor:pointer;min-height:48px\" style-hover=\"background:#ECE9E1\">Book a class<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goPricing }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border:1px solid #3A3A46;white-space:nowrap;padding:18px 30px;cursor:pointer;min-height:48px;color:#ECE9E1\" style-hover=\"border-color:#F5D400;color:#F5D400\">See pricing<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- split-flap stat ticker -->\n    <section aria-label=\"Live club metrics\" style=\"border-top:1px solid #26262E;border-bottom:1px solid #26262E;background:#101014\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:clamp(28px,4vw,44px) 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(28px,4vw,48px)\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7C7C88\">Members training this week<\u002Fspan>\n          {{ tickerMembers }}\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7C7C88\">Open slots today<\u002Fspan>\n          {{ tickerSlots }}\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7C7C88\">Average member rating<\u002Fspan>\n          {{ tickerRating }}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1240px;margin:0 auto;padding:clamp(48px,7vw,96px) 24px clamp(72px,10vw,140px)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1px;background:#26262E;border:1px solid #26262E\">\n        <sc-for list=\"{{ entries }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ e.go }}\" style=\"background:#141419;text-align:left;padding:clamp(28px,4vw,44px) clamp(24px,3vw,36px);cursor:pointer;display:flex;flex-direction:column;gap:18px;min-height:250px;transition:background .25s ease\" style-hover=\"background:#191920\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:#F5D400\">{{ e.num }}<\u002Fspan>\n            <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(30px,4vw,40px);text-transform:uppercase;letter-spacing:.01em;line-height:1\">{{ e.title }}<\u002Fspan>\n            <span style=\"color ize:11px;letter-spacing:.14em;color:#ECE9E1\">{{ c.duration }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(26px,3.2vw,34px);text-transform:uppercase;line-height:1.02;letter-spacing:.01em\">{{ c.name }}<\u002Fh3>\n          <p style=\"margin:0;color:#9A9AA6;font-size:15px;line-height:1.6\">{{ c.blurb }}<\u002Fp>\n          <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid #24242C;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#A2A2AE\">{{ c.coach }}<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6E6E7A\">{{ c.level }}<\u002Fspan>\n              <div style=\"display:flex;gap:3px\">\n                <sc-for list=\"{{ c.bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                  <span style=\"width:14px;height:4px;display:block;background:{{ b.bg }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══════════════ TRAINERS ══════════════ -->\n  <sc-if value=\"{{ isTrainers }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1240px;margin:0 auto;padding:clamp(48px,7vw,96px) 24px clamp(72px,10vw,140px)\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#F5D400\">03 / Trainers<\u002Fspan>\n    <h2 style=\"margin:18px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(40px,7vw,86px);line-height:.92;letter-spacing:-.01em\">Fou ], ['07:30', 'Row & Ride', 'Adeyemi', 14, 11], ['12:15', 'Mobility & Recovery', 'Park', 18, 5], ['17:30', 'Metabolic Conditioning', 'Adeyemi', 20, 19], ['18:45', 'Boxing Fundamentals', 'Ibarra', 12, 12]],\n  Sat: [['08:00', 'Metabolic Conditioning', 'Adeyemi', 20, 16], ['09:15', 'Strength Foundations', 'Renner', 16, 10], ['10:30', 'Boxing Fundamentals', 'Ibarra', 12, 6], ['11:45', 'Flow & Breath', 'Park', 22, 14], ['13:00', 'Mobility & Recovery', 'Park', 18, 8]]\n};\n\nconst NAV = [\n  { label: 'Home', page: 'home' },\n  { label: 'Classes', page: 'classes' },\n  { label: 'Trainers', page: 'trainers' },\n  { label: 'Pricing', page: 'pricing' },\n  { label: 'Schedule', page: 'schedule' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    page: 'home', day: 'Mon', booked: {}, confirm: null,\n    menuOpen: false, wide: true,\n    stats: { members: 0, slots: 0, rating: 0 }\n  };\n\n  componentDidMount() {\n    this.measure();\n    this._onResize = () => this.measure();\n    window.addEventListener('resize', this._onResize);\n    this.runCounters();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  measure() {\n    const wide = window.innerWidth >= 860;\n    if (wide !== this.state.wide) this.setState({ wide, menuOpen: false });\n  }\n\n  runCounters() {\n    const targets = { members: 1284, slots: 37, rating: 4.93 };\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) { this.setState({ stats: targets }); return; }\n    const start = performance.now(), dur = 1500;\n    const tick = (now) => {\n      const t = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - t, 3);\n      this.setState({ stats: {\n        members: Math.round(targets.members * e),\n        slots: Math.round(targets.slots * e),\n        rating: targets.rating * e\n      }});\n      if (t < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  flaps(text, accent) {\n    const cells = String(text).split('').map((ch, i) => {\n      const sep = ch === '.' || ch === ',';\n      return React.createElement('span', {\n        key: i + ':' + ch,\n        style: {\n          fontFamily: \"'IBM Plex Mono', monospace\", fontWeight: 500,\n          fontSize: sep ? '26px' : 'clamp(38px,5.4vw,58px)',\n          lineHeight: 1, letterSpacing: '-.02em',\n          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',\n          minWidth: sep ? '12px' : '0.66em',\n          padding: sep ? '0' : '10px 6px 12px',\n          background: sep ? 'transparent' : '#181820',\n          color: accent ? YELLOW : PAPER,\n          borderTop: sep ? 'none' : '1px solid #2E2E38',\n          boxShadow: sep ? 'none' : 'inset 0 -1px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04)',\n          transformOrigin: 'top center',\n          animation: 'flapIn .42s cubic-bezier(.3,.8,.3,1) both',\n          alignSelf: sep ? 'flex-end' : 'stretch'\n        }\n      }, ch);\n    });\n    return React.createElement('div', {\n      style: { display: 'flex', gap: '3px', alignItems: 'stretch', perspective: '420px' }\n    }, cells);\n  }\n\n  slotsFor(day) {\n    const booked = this.state.booked;\n    return BOARD[day].map((s, i) => {\n      const id = day + '-' + i;\n      const isBooked = !!booked[id];\n      const taken = s[4] + (isBooked ? 1 : 0);\n      const isFull = !isBooked && taken >= s[3];\n      return { id, day, time: s[0], cls: s[1], coach: s[2], size: s[3], taken, isBooked, isFull, isOpen: !isBooked && !isFull };\n    });\n  }\n\n  book(slot) {\n    if (slot.isFull || slot.isBooked) return;\n    const ref = 'BL-' + slot.day.toUpperCase() + '-' + slot.time.replace(':', '');\n    this.setState(s => ({\n      booked: Object.assign({}, s.booked, { [slot.id]: true }),\n      confirm: { id: slot.id, ref, title: slot.cls, meta: slot.day + ' · ' + slot.time + ' · Coach ' + slot.coach + ' · Spot ' + (slot.taken + 1) + ' of ' + slot.size }\n    }));\n  }\n\n  renderVals() {\n    const { page, day, stats, confirm } = this.state;\n    const rows = this.slotsFor(day);\n\n    return {\n      wide: this.state.wide,\n      narrow: !this.state.wide,\n      menuOpen: this.state.menuOpen && !this.state.wide,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n\n      isHome: page === 'home', isClasses: page === 'classes', isTrainers: page === 'trainers',\n      isPricing: page === 'pricing', isSchedule: page === 'schedule',\n      goHome: () => this.go('home'),\n      goPricing: () => this.go('pricing'),\n      goSchedule: () => this.go('schedule'),\n\n      nav: NAV.map(n => ({\n        label: n.label,\n        fg: page === n.page ? PAPER : '#8A8A96',\n        line: page === n.page ? YELLOW : 'transparent',\n        go: () => this.go(n.page)\n      })),\n\n      tickerMembers: this.flaps(stats.members.toLocaleString('en-US'), false),\n      tickerSlots: this.flaps(String(stats.slots), true),\n      tickerRating: this.flaps(stats.rating.toFixed(2), false),\n\n      entries: [\n        { num: '01', title: 'Classes', body: 'Six formats, published intensity bands, fixed protocols.', cta: 'View formats', go: () => this.go('classes') },\n        { num: '02', title: 'Trainers', body: 'Four coaches who program for progression, not punishment.', cta: 'Meet the team', go: () => this.go('trainers') },\n        { num: '03', title: 'Schedule', body: 'Live weekly board with real capacity. Book in one tap.', cta: 'Open the board', go: () => this.go('schedule') }\n      ],\n\n      classes: CLASSES.map((c, i) => ({\n        num: String(i + 1).padStart(2, '0'),\n        name: c.name, coach: 'Coach ' + c.coach, duration: c.duration, level: c.level, blurb: c.blurb,\n        bars: [0, 1, 2, 3, 4].map(n => ({ bg: n < c.intensity ? YELLOW : '#2C2C36' }))\n      })),\n\n      trainers: TRAINERS.map(t => ({\n        name: t.name, bio: t.bio, meta: t.meta, disciplineLabel: t.discipline,\n        slot: t.slot, slotHint: 'Portrait — ' + t.name\n      })),\n\n      tiers: TIERS.map(t => ({\n        name: t.name, badge: t.badge, price: t.price, unit: t.unit, blurb: t.blurb, cta: t.cta,\n        features: t.features.map(f => ({ text: f })),\n        bg: t.featured ? YELLOW : '#141419',\n        fg: t.featured ? '#141419' : PAPER,\n        muted: t.featured ? 'rgba(20,20,25,.72)' : '#9A9AA6',\n        line: t.featured ? 'rgba(20,20,25,.22)' : '#24242C',\n        tick: t.featured ? 'rgba(20,20,25,.55)' : YELLOW,\n        badgeFg: t.featured ? '#141419' : STEEL,\n        badgeLine: t.featured ? 'rgba(20,20,25,.35)' : '#33333D',\n        btnBg: t.featured ? '#141419' : 'transparent',\n        btnFg: t.featured ? PAPER : PAPER,\n        btnLine: t.featured ? '#141419' : '#3A3A46'\n      })),\n\n      days: DAYS.map(d => {\n        const open = this.slotsFor(d).filter(s => s.isOpen).length;\n        return {\n          label: d, count: open + ' open',\n          bg: d === day ? '#1C1C24' : '#141419',\n          fg: d === day ? PAPER : '#7E7E8A',\n          sub: d === day ? YELLOW : '#55555F',\n          go: () => this.setState({ day: d })\n        };\n      }),\n\n      boardStamp: 'Week 32 · updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),\n\n      rows: rows.map(r => ({\n        time: r.time, cls: r.cls, coach: r.coach,\n        cap: r.taken + '/' + r.size,\n        isBooked: r.isBooked, isOpen: r.isOpen, isFull: r.isFull,\n        disabled: r.isFull || r.isBooked,\n        cursor: r.isOpen ? 'pointer' : 'default',\n        rowBg: r.isBooked ? '#191913' : 'transparent',\n        timeFg: r.isFull ? '#55555F' : PAPER,\n        nameFg: r.isFull ? '#5E5E68' : PAPER,\n        capFg: r.isFull ? '#55555F' : '#A2A2AE',\n        aria: r.cls + ' at ' + r.time + ' with coach ' + r.coach + ', ' + (r.isBooked ? 'booked' : r.isFull ? 'full' : 'open, tap to book'),\n        go: () => this.book(r)\n      })),\n\n      hasConfirm: !!confirm,\n      confirmRef: confirm ? confirm.ref : '',\n      confirmTitle: confirm ? confirm.title : '',\n      confirmMeta: confirm ? confirm.meta : '',\n      dismissConfirm: () => this.setState({ confirm: null }),\n      cancelBooking: () => this.setState(s => {\n        const b = Object.assign({}, s.booked);\n        if (s.confirm) delete b[s.confirm.id];\n        return { booked: b, confirm: null };\n      })\n    };\n  }\n\n  go(page) {\n    this.setState({ page, menuOpen: false });\n    window.scrollTo({ top: 0, behavior: 'auto' });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
